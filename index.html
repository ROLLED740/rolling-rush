<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rolling Rush — Play Free</title>
<meta name="description" content="Rolling Rush — a free 3D ball-runner across 8 worlds. Play free on itch.io.">
<!-- Instant redirect for browsers that honor it -->
<meta http-equiv="refresh" content="0; url=https://rolled740.itch.io/rolling-rush">
<link rel="canonical" href="https://rolled740.itch.io/rolling-rush">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    display:flex;align-items:center;justify-content:center;
    background:linear-gradient(160deg,#2b1a5e,#1a103c);
    color:#fff;text-align:center;padding:24px;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  .wrap{display:flex;flex-direction:column;align-items:center;gap:18px;max-width:32ch}
  h1{
    font-size:clamp(38px,9vw,64px);line-height:1.05;
    background:linear-gradient(180deg,#ffd23e,#ff7a59);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  }
  p{opacity:.85;font-size:clamp(15px,4vw,18px);line-height:1.5}
  a.go{
    margin-top:4px;text-decoration:none;font-weight:800;
    font-size:clamp(17px,4.5vw,20px);color:#2a1450;
    background:linear-gradient(180deg,#ffe27a,#ffb347);
    padding:15px 40px;border-radius:999px;
    box-shadow:0 6px 0 rgba(0,0,0,.25),0 10px 24px rgba(0,0,0,.35);
  }
  .small{font-size:13px;opacity:.6}
</style>
</head>
<body>
  <div class="wrap">
    <h1>Rolling Rush</h1>
    <p>Taking you to the game on itch.io…</p>
    <a class="go" href="https://rolled740.itch.io/rolling-rush">▶ PLAY NOW</a>
    <p class="small">Not redirected? Tap the button above.</p>
  </div>
  <script>
    // Replace (not push) so Back doesn't bounce the player into a loop.
    location.replace('https://rolled740.itch.io/rolling-rush');
  </script>
</body>
</html>
